<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Matrícula - Escola Online</title>
</head>

<body>
    <h1>Matrícula - Escola Online</h1>
    <form>
        <fieldset>
            <legend>Dados pessoais</legend>
            <label for="nome completo">Nome Completo:</label>
            <input type="text" id="nome completo" name="nome completo">
            <br>
            <br>
            <label for="Data de nascimento">Data de Nascimento:</label>
            <input type="date" id="data de nascimento" name="Data de nascimento">
            <br>
            <br>
            <label for="e-mail do aluno">E-mail do Aluno:</label>
            <input type="email" id="e-mail do aluno" name="e-mail do aluno" placeholder="aluno@exemplo.com">
            <br>
            <br>
            <label for="senha de acesso">Senha de Acesso:</label>
            <input type="password" id="senha de acesso" name="senha de acesso" placeholder="*********">
            <br>
            <br>
            <label for="telefone de emergência">Telefone de Emergência:</label>
            <input type="tel" id="telefone de emergência" name="telefone de emergência" placeholder="(00) 00000-0000">
            <br>
            <br>
        </fieldset>

        <fieldset>
            <legend>Preferências de Estado</legend>
            <br>
            <p>Áreas de Interesse:</p>
            <input type="checkbox" id="front-end" name="áreas de interesse" value="front-end">
            <label for="front-end">Front-end</label>
            <br>
            <input type="checkbox" id="back-end" name="áreas de interesse" value="back-end">
            <label for="back-end">Back-end</label>
            <br>
            <input type="checkbox" id="design" name="áreas de interesse" value="design">
            <label for="design">Design</label>
            <br>
            <input type="checkbox" id="dados" name="áreas de interesse" value="dados">
            <label for="dados">Dados</label>
            <br>
            <br>
            <label for="Como conheceu a escola?">Como conheceu a escola?</label>
            <select name="Como conheceu a escola?">
                <option value="ind">Indicação</option>
            </select>
        </fieldset>
        <br>
        <button type="submit">Matricular</button>
        <button type="reset">Limpar</button>
    </form>
</body>

</html>
